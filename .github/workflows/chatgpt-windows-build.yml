name: ChatGPT Windows Build

on:
  push:
    branches:
      - chatgpt/windows-build-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MIXAR_ENV: Prod
      BUILD_CORES: 2
      ROBOCOPY_THREADS: 16

    steps:
      - name: Checkout Mixar source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install build helper tools
        shell: powershell
        run: |
          git lfs install
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
            choco install subversion -y --no-progress
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          cmake --version
          ninja --version
          git lfs version
          svn --version --quiet
          make --version
          gh --version

      - name: Validate release version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '3.3.3') {
            throw "Expected VERSION=3.3.3, found '$version'"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ARCHIVE=mixar-$version-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize Blender upstream and dependencies
        shell: cmd
        run: call scripts\windows\init.bat

      - name: Build Mixar Windows x64 (Prod)
        shell: cmd
        run: call scripts\windows\build_ninja.bat

      - name: Show build output
        if: success()
        shell: powershell
        run: |
          Get-ChildItem -Path build\Prod\bin -Force | Select-Object Name, Length, LastWriteTime
          $exe = Get-ChildItem -Path build\Prod\bin -Recurse -Filter mixar.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'mixar.exe was not produced' }
          Write-Host "Built executable: $($exe.FullName)"

      - name: Package Mixar release
        if: success()
        shell: powershell
        run: |
          if (Test-Path $env:RELEASE_ARCHIVE) {
            Remove-Item $env:RELEASE_ARCHIVE -Force
          }
          Compress-Archive -Path 'build\Prod\bin\*' -DestinationPath $env:RELEASE_ARCHIVE -CompressionLevel Optimal
          $archive = Get-Item $env:RELEASE_ARCHIVE
          Write-Host "Release package: $($archive.Name) ($($archive.Length) bytes)"

      - name: Upload compiled Mixar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mixar-${{ env.RELEASE_VERSION }}-windows-x64
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Deploy GitHub Release
        if: success()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $tag = $env:RELEASE_TAG
          $archive = $env:RELEASE_ARCHIVE

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; replacing Windows asset."
            gh release upload $tag $archive --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload asset to release $tag" }
          }
          else {
            Write-Host "Creating release $tag."
            gh release create $tag $archive `
              --repo $repo `
              --target '${{ github.sha }}' `
              --title "Mixar $env:RELEASE_VERSION" `
              --notes "Mixar $env:RELEASE_VERSION Windows x64 production build. Built and deployed automatically by GitHub Actions."
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }
